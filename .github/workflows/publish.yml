name: Publish npm packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          for (const directory of ['walli_chat', 'walli_chat_blocks']) {
            const pkg = JSON.parse(readFileSync(`${directory}/package.json`, 'utf8'));
            if (tag !== `v${pkg.version}`) {
              throw new Error(`Tag ${tag} does not match ${pkg.name}@${pkg.version}`);
            }
          }
          NODE

      - name: Install Playwright Chromium
        run: pnpm --filter @wallilabs/chat exec playwright install --with-deps chromium

      - name: Run release gate
        run: pnpm --filter @wallilabs/chat run test:release

      - name: Publish packages
        run: pnpm run release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
            fi
          fi
