name: Publish npm packages

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version pull request or publish packages
        id: changesets
        uses: changesets/action@v2
        with:
          commit-message: "chore: release packages"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: release packages"
          publish-script: pnpm run release
          version-script: pnpm run version-packages
