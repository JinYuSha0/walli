name = "walli_core"
main = "./src/worker/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[ai]
binding = "AI"

[images]
binding = "IMAGES"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "R2"
bucket_name = "walli"

[[d1_databases]]
binding = "DB"
database_name = "walli_core"
database_id = "a64f7d00-ad98-4e14-ad7f-1162a3e21a11"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "APP_KV"
id = "a3ead2192a94459db359c9d11e47bc92"

[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "CONFIRM_FLOW_DO"
class_name = "ConfirmFlowDO"

[exports.UserDO]
type = "durable-object"
storage = "sqlite"

[exports.ConfirmFlowDO]
type = "durable-object"
storage = "sqlite"

# Dedicated private namespace. Never enable public instance or namespace endpoints.
[[ai_search_namespaces]]
binding = "DATASET_SEARCH"
namespace = "walli-datasets"

[[queues.producers]]
binding = "DATASET_SYNC_QUEUE"
queue = "walli-dataset-sync"

[[queues.consumers]]
queue = "walli-dataset-sync"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "walli-dataset-sync-dlq"
